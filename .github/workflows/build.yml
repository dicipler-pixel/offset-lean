# Build every module, replay every proof in an independent kernel checker,
# audit the axioms of every named theorem, and confirm every false control is
# rejected. A green badge means all four passed on the exact commit shown.
name: Lean proof check

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: proof-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false

      - name: Install the pinned Lean toolchain
        run: |
          set -euo pipefail
          curl -sSfL https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh -o "$RUNNER_TEMP/elan-init.sh"
          bash "$RUNNER_TEMP/elan-init.sh" -y --default-toolchain "$(cat lean-toolchain)"
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"

      - name: Resolve Mathlib at the pinned tag
        run: lake update

      - name: Build, and replay every module in the independent kernel checker
        uses: leanprover/lean-action@50fcf42d2e460296f1a34b402e990d1b24f8b596
        with:
          use-mathlib-cache: true
          use-github-cache: false
          build: true
          leanchecker: true
          leanchecker-args: OperatorFirst OperatorFirst.Offset OperatorFirst.OffsetFock OperatorFirst.OffsetEndpoint OperatorFirst.EndpointProgress OperatorFirst.EndpointTransfer OperatorFirst.FiniteCovariance OperatorFirst.BandObstruction OperatorFirst.LaurentBoundary OperatorFirst.RiceMeleOddSymmetry OffsetLean OffsetLean.Headline

      - name: Axiom audit, theorem inventory and false controls
        run: python3 scripts/verify.py

      - name: Keep the evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: offset-lean-evidence
          path: |
            verification/
            lake-manifest.json
          if-no-files-found: warn
          retention-days: 90
