name = "offset-lean"
version = "1.0.0"
defaultTargets = ["OperatorFirst", "OffsetLean"]

[[require]]
name = "mathlib"
git = "https://github.com/leanprover-community/mathlib4.git"
rev = "v4.33.0"

# The proof library. Every module under OperatorFirst/ is a byte-identical copy
# of the verified source (see PROVENANCE.md). OperatorFirst.lean imports them all
# so that `lake build` compiles every one of them.
[[lean_lib]]
name = "OperatorFirst"

# The front door: headline statements in plain Mathlib terms.
[[lean_lib]]
name = "OffsetLean"
